[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-scope"
version = "0.1.0"
description = "GPU benchmark measurement and regression analysis"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
perf-scope = "perf_scope.cli:main"

[project.optional-dependencies]
dev = ["build==1.4.0", "ruff==0.15.15"]
plot = ["matplotlib>=3.9,<4"]
resnet = ["torch==2.7.1", "torchvision==0.22.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
