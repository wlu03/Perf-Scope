name: CUDA build

on:
  pull_request:
    paths:
      - "cuda/**"
      - ".github/workflows/cuda.yml"
  push:
    branches: [main]
    paths:
      - "cuda/**"
      - ".github/workflows/cuda.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v6
      - run: apt-get update && apt-get install -y --no-install-recommends cmake
      - run: cmake -S cuda -B build/cuda -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cuda --parallel 2
      - run: ctest --test-dir build/cuda -LE gpu --output-on-failure
